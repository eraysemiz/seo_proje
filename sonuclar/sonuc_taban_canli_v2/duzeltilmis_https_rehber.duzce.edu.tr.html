<script>
        $(document).ready(function () {
            // TempData hata mesajını kontrol et

            let searchTimeout;
            
            // URL parametrelerinden birim ve bölümü oku
            function getUrlParameter(name) {
                name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
                var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
                var results = regex.exec(location.search);
                return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
            }
            
            var urlDepartmentId = getUrlParameter('departmentId');
            var urlSubDepartmentId = getUrlParameter('subDepartmentId');

            function fetchRooms() {
                var searchQuery = $('#searchQuery').val().trim();
                var departmentId = $('#departmentSelect').val();
                var subDepartmentId = $('#subDepartmentSelect').val();

                if (searchQuery.length > 0 && searchQuery.length < 3) return;

                if (searchQuery.length === 0 && !departmentId && !subDepartmentId) {
                    $('#tableBody').html('<tr><td colspan="8" class="text-center text-muted py-5"><h5>Lütfen arama yapın veya birim/bölüm seçerek filtreleyin.</h5></td></tr>');
                    return;
                }

                $.ajax({
                    url: '/Home/FilterRooms', type: 'GET',
                    data: { searchQuery: searchQuery, departmentId: departmentId, subDepartmentId: subDepartmentId },
                    success: function (response) { updateTable(response); },
                    error: function () { $('#tableBody').html('<tr><td colspan="8" class="text-center text-danger">Kayıtları getirirken bir hata oluştu.</td></tr>'); }
                });
            }

            function updateTable(data) {
                var tableBody = $('#tableBody');
                tableBody.html('');
                if (!data || data.length === 0) {
                    tableBody.html('<tr><td colspan="8" class="text-center">Kayıt bulunamadı.</td></tr>');
                    return;
                }
                var isUserLoggedIn = false;
                data.forEach(function (row) {
                    var editUrl = `/Home/Edit/${row.id}`;
                    var loginButtons = isUserLoggedIn ? `<td class="text-nowrap"><a href="${editUrl}" class="btn btn-sm btn-primary edit-btn"><i class="bi bi-pencil"></i> Düzelt</a> <button onclick="deleteInternalNumber(${row.id}, '${row.extensionNumber}')" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i> Sil</button></td>` : '';
                    var academicProfileLink = row.academicProfileUrl ? `<a href="${row.academicProfileUrl}" target="_blank"><i class="bi bi-link-45deg"></i> Akademik Profil</a>` : `<span>-</span>`;
                    var tableRow = `<tr><td>${row.roleName || ''}</td><td>${row.titleName || ''}</td><td>${row.firstName || ''}</td><td>${row.lastName || ''}</td><td>${academicProfileLink}</td><td>${row.departmentName || ''}</td><td>${row.subDepartmentName || ''}</td>${loginButtons}<td class="text-center fw-bold">${row.extensionNumber || ''}</td></tr>`;
                    tableBody.append(tableRow);
                });
            }

            function processContactInfo(contactInfo) {
                console.log('processContactInfo called with:', contactInfo);
                $('#contactInfoContainer, #externalPhones, #externalFaxes').hide();
                var phonesExist = contactInfo.phones && contactInfo.phones.length > 0;
                var faxesExist = contactInfo.faxes && contactInfo.faxes.length > 0;
                
                console.log('phonesExist:', phonesExist, 'faxesExist:', faxesExist);

                if (phonesExist) {
                    $('#phoneNumbers').text(contactInfo.phones.join(' / '));
                    $('#externalPhones').show();
                    console.log('Phones shown');
                }
                if (faxesExist) {
                    $('#faxNumbers').text(contactInfo.faxes.join(' / '));
                    $('#externalFaxes').show();
                    console.log('Faxes shown');
                }
                if (phonesExist || faxesExist) {
                    $('#contactInfoContainer').show();
                    console.log('Contact info container shown');
                }
            }

            // --- OLAY YÖNETİCİLERİ ---

            $.get('/Home/GetDepartments', function (data) {
                if (data) {
                    data.forEach(function (item) { $('#departmentSelect').append(new Option(item.name, item.id)); });
                    
                    // URL'den gelen departmentId varsa seç
                    if (urlDepartmentId) {
                        $('#departmentSelect').val(urlDepartmentId).trigger('change');
                    }
                }
            });

            $('#departmentSelect').change(function () {
                var departmentId = $(this).val();
                var subDepartmentSelect = $('#subDepartmentSelect');
                subDepartmentSelect.empty();
                
                // Önce arama kutusunu temizle
                $('#searchQuery').val('');
                $('#contactInfoContainer').hide();
                
                // Kullanıcının yetkisine göre "Tüm Bölümler" seçeneğini ekle
                var userLoginData = null;
                var showAllSubDepartments = false;
                
                if (!userLoginData) {
                    // Login olmayan kullanıcılar için tüm bölümleri göster
                    showAllSubDepartments = true;
                } else if (userLoginData && userLoginData.roleName) {
                    // SuperAdmin ise tüm bölümleri görebilir
                    if (userLoginData.roleName.includes("SuperAdmin")) {
                        showAllSubDepartments = true;
                    }
                    // Admin_TelefonRehberi için yetki kontrolü yapılmıyor, direkt GetSubDepartmentsByDepartmentId çağrılıyor
                }
                
                // Eğer "Tüm Bölümler" gösterilecekse kayıtları getir
                if (showAllSubDepartments) {
                    // "Tüm Bölümler" seçeneği varsa kayıtları getir
                    fetchRooms();
                }

                if (departmentId) {
                    // Eğer "Tüm Bölümler" seçeneği varsa, GetSubDepartmentsByDepartmentId çağırma
                    if (!showAllSubDepartments) {
                        $.get('/Home/GetSubDepartmentsByDepartmentId/' + departmentId, function (data) {
                            
                            if (data && data.type) {
                                if (data.type === "full_department_access") {
                                    // Birimde tüm bölümlerde yetkili - "Tüm Bölümler" + bölümler
                                    subDepartmentSelect.append('<option value="">Tüm Bölümler</option>');
                                    if (data.subDepartments && data.subDepartments.length > 0) {
                                        data.subDepartments.forEach(function (item) { 
                                            subDepartmentSelect.append(new Option(item.name, item.id)); 
                                        });
                                    }
                                                            } else if (data.type === "all_subdepartments_access") {
                                // Kısıtlı Admin - birimde tanımlı değil ama tüm bölümlerde yetkili
                                // "Tüm Bölümler" ÇIKMALI + bölümler gelsin (çift yazılmasın)
                                // Önce dropdown'ı tamamen temizle (çift gelmesini önlemek için)
                                subDepartmentSelect.empty();
                                
                                subDepartmentSelect.append('<option value="">Tüm Bölümler</option>');
                                if (data.subDepartments && data.subDepartments.length > 0) {
                                    // Her bölümü sadece bir kez ekle - çift yazılmasını önle
                                    var addedIds = [];
                                    data.subDepartments.forEach(function (item) { 
                                        // Eğer bu ID daha önce eklenmemişse ekle
                                        if (addedIds.indexOf(item.id) === -1) {
                                            subDepartmentSelect.append(new Option(item.name, item.id)); 
                                            addedIds.push(item.id);
                                        }
                                    });
                                }
                            } else if (data.type === "partial_access") {
                                // Kısıtlı Admin - sadece bazı bölümlerde yetkili
                                // "Tüm Bölümler" ÇIKMAZ, sadece yetkili bölümler
                                if (data.subDepartments && data.subDepartments.length > 0) {
                                    // Önce dropdown'ı tamamen temizle (çift gelmesini önlemek için)
                                    subDepartmentSelect.empty();
                                    
                                    // Her bölümü sadece bir kez ekle
                                    var addedIds = [];
                                    data.subDepartments.forEach(function (item) { 
                                        // Eğer bu ID daha önce eklenmemişse ekle
                                        if (addedIds.indexOf(item.id) === -1) {
                                            subDepartmentSelect.append(new Option(item.name, item.id)); 
                                            addedIds.push(item.id);
                                        }
                                    });
                                    
                                    // Debug: kaç tane seçenek eklendiğini kontrol et
                                    console.log('Partial access - Added options:', subDepartmentSelect.find('option').length);
                                }
                                } else if (data.type === "no_access") {
                                    // Hiç yetkisi yok - hiçbir şey ekleme
                                    return;
                                }
                                
                                // URL'den gelen subDepartmentId varsa seç, yoksa Admin_TelefonRehberi için ilk bölümü otomatik seç
                                if (urlSubDepartmentId && subDepartmentSelect.find('option[value="' + urlSubDepartmentId + '"]').length > 0) {
                                    setTimeout(function() {
                                        subDepartmentSelect.val(urlSubDepartmentId);
                                        fetchRooms();
                                    }, 100);
                                } else if (userLoginData && userLoginData.roleName && userLoginData.roleName.includes("Admin_TelefonRehberi")) {
                                    setTimeout(function() {
                                        if (subDepartmentSelect.find('option').length > 0) {
                                            var firstOption = subDepartmentSelect.find('option:first');
                                            subDepartmentSelect.val(firstOption.val());
                                            // İlk bölüm seçildi, kayıtları getir
                                            fetchRooms();
                                        }
                                    }, 100);
                                }
                            }
                        });
                    }
                    $.get('/Home/GetDepartmentContactInfo/' + departmentId, function (contactInfo) { processContactInfo(contactInfo); });
                }
                
                // Eğer "Tüm Bölümler" seçeneği yoksa, fetchRooms() burada çağrılmaz
                // Çünkü ilk bölüm otomatik seçildikten sonra çağrılacak
            });

            $('#subDepartmentSelect').change(function () {
                var subDepartmentId = $(this).val();
                console.log('SubDepartment change event - subDepartmentId:', subDepartmentId);
                
                // Önce arama kutusunu temizle
                $('#searchQuery').val('');
                
                if (!subDepartmentId || subDepartmentId === '0') {
                    // "Tüm Bölümler" seçildiğinde birim telefonlarını göster
                    var departmentId = $('#departmentSelect').val();
                    console.log('Tüm Bölümler seçildi, DepartmentId:', departmentId);
                    if (departmentId) {
                        $.get('/Home/GetDepartmentContactInfo/' + departmentId, function (contactInfo) { 
                            console.log('Department Contact Info:', contactInfo);
                            // Eğer birim telefonları varsa göster, yoksa hiçbir şey yapma (mevcut telefonları koru)
                            if (contactInfo.phones && contactInfo.phones.length > 0 || contactInfo.faxes && contactInfo.faxes.length > 0) {
                                console.log('Birim telefonları var, processContactInfo çağrılıyor');
                                processContactInfo(contactInfo);
                            } else {
                                // Birim telefonları yoksa, hiçbir şey yapma (mevcut telefonları koru)
                                console.log('Birim telefonları yok, mevcut telefonları koru - processContactInfo çağrılmadı');
                            }
                        });
                    } else {
                        // DepartmentId yoksa da hiçbir şey yapma
                        console.log('DepartmentId yok, mevcut telefonları koru');
                    }
                    fetchRooms();
                    return;
                }
                console.log('Bölüm seçildi, bölüm telefonları getiriliyor');
                $('#contactInfoContainer').hide();
                $.get('/Home/GetSubDepartmentContactInfo/' + subDepartmentId, function (contactInfo) { 
                    console.log('SubDepartment Contact Info:', contactInfo);
                    processContactInfo(contactInfo); 
                });
                fetchRooms();
            });

            $('#searchQuery').on('input', function () {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(function() {
                    $('#departmentSelect').val('');
                    $('#subDepartmentSelect').empty();
                    $('#contactInfoContainer').hide();
                    fetchRooms();
                }, 500);
            });
            
            // Create butonuna tıklanınca seçili birim/bölümü URL'ye ekle
            $('#createBtn').on('click', function(e) {
                e.preventDefault();
                var departmentId = $('#departmentSelect').val();
                var subDepartmentId = $('#subDepartmentSelect').val();
                var url = '/Home/Create';
                if (departmentId) {
                    url += '?departmentId=' + departmentId;
                    if (subDepartmentId) {
                        url += '&subDepartmentId=' + subDepartmentId;
                    }
                }
                window.location.href = url;
            });
            
            // Edit butonlarına delegated event listener ekle
            $(document).on('click', '.edit-btn', function(e) {
                e.preventDefault();
                var editUrl = $(this).attr('href');
                var departmentId = $('#departmentSelect').val();
                var subDepartmentId = $('#subDepartmentSelect').val();
                if (departmentId) {
                    editUrl += '?departmentId=' + departmentId;
                    if (subDepartmentId) {
                        editUrl += '&subDepartmentId=' + subDepartmentId;
                    }
                }
                window.location.href = editUrl;
            });
        });

        // Dahili numara silme fonksiyonu
        function deleteInternalNumber(id, extensionNumber) {
            Swal.fire({
                title: 'Emin misiniz?',
                text: `${extensionNumber} dahili numaralı kaydı silmek istediğinizden emin misiniz?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Evet, sil!',
                cancelButtonText: 'İptal'
            }).then((result) => {
                if (result.isConfirmed) {
                    // CSRF token'ı al
                    var token = $('input[name="__RequestVerificationToken"]').val();
                    
                    // Ajax ile silme işlemi
                    $.ajax({
                        url: '/Home/Delete',
                        type: 'POST',
                        data: {
                            id: id,
                            __RequestVerificationToken: token
                        },
                        success: function(response) {
                            Swal.fire({
                                title: 'Silindi!',
                                text: 'Seçili dahili numara başarıyla silindi.',
                                icon: 'success',
                                confirmButtonText: 'Tamam'
                            }).then(() => {
                                // Seçili birim ve bölümü koru
                                var departmentId = $('#departmentSelect').val();
                                var subDepartmentId = $('#subDepartmentSelect').val();
                                var url = '/Home/Index';
                                if (departmentId) {
                                    url += '?departmentId=' + departmentId;
                                    if (subDepartmentId) {
                                        url += '&subDepartmentId=' + subDepartmentId;
                                    }
                                }
                                window.location.href = url;
                            });
                        },
                        error: function(xhr, status, error) {
                            Swal.fire('Hata', 'Dahili numara silinirken bir hata oluştu.', 'error');
                        }
                    });
                }
            });
        }
    </script>
